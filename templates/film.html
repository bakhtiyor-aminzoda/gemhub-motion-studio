<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>film</title>
<!-- Шаблон GemHub Motion Studio. Каждый кадр = seek(t). Замените цвета, шрифты, сцены. Скопируйте рядом three.min.js. -->
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Manrope:wght@600;800&family=IBM+Plex+Mono:wght@500&display=block&subset=cyrillic" rel="stylesheet">
<style>
:root{--bg:#090C0B;--a1:#2BF07A;--a2:#3FD8F0;--w:#EEF4F1}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;background:var(--bg);color:var(--w);font-family:Manrope,sans-serif}
.L{position:absolute;inset:0}.a{position:absolute}
.U{font-family:Unbounded;font-weight:900;text-transform:uppercase;line-height:.86;white-space:nowrap}
.grad{background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
#gl{position:absolute;inset:0}
</style></head><body>
<div class="L" id="BACK"></div><canvas id="gl"></canvas><div class="L" id="FRONT"></div>
<script src="three.min.js"></script>
<script>
// размер кадра: 1920x1080 (16:9), 1080x1920 (9:16), 1080x1080 (1:1). Всё ниже считается от W и H.
const W=1920,H=1080,U=Math.min(W,H)/1080; // U — масштаб размеров текста и отступов
document.documentElement.style.cssText=document.body.style.cssText=`width:${W}px;height:${H}px`;
// ---------- инструменты ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lerp=(a,b,e)=>a+(b-a)*e,outQ=x=>1-Math.pow(1-clamp(x),4);
// пружина (точная формула, лёгкий перелёт): 0 -> 1
function stepR(x,w=14,z=.78){if(x<=0)return 0;const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*x)*(Math.cos(wd*x)+z*w/wd*Math.sin(wd*x))}
const mk=(p,c,h,s)=>{const d=document.createElement('div');if(c)d.className=c;if(h!=null)d.innerHTML=h;if(s)d.style.cssText=s;p.appendChild(d);return d};
// показать/скрыть, сохраняя исходный display (flex и т.п.)
const on=(e,v)=>{if(e._d===undefined)e._d=e.style.display;e.style.display=v?e._d:'none';return v};
// появление: сдвиг на пружине + короткое размытие
function pop(e,t,t0,dx=0,dy=40,bl=14){if(!on(e,t>=t0))return 0;const k=t-t0,s=stepR(k);e.style.opacity=clamp(k/.1);e.style.translate=`${dx*(1-s)}px ${dy*(1-s)}px`;e.style.filter=`blur(${(bl*Math.exp(-k*16)).toFixed(2)}px)`;return s}
const kick=t=>Math.exp(-((t%.5+.5)%.5)*11); // удар на каждую долю при 120 BPM
const F=document.getElementById('FRONT'),B=document.getElementById('BACK');

// ---------- 3D: главный объект (зеркальная звезда) ----------
const R3=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),alpha:true,antialias:true,preserveDrawingBuffer:true});
R3.setPixelRatio(1);R3.setSize(W,H,false);R3.outputEncoding=THREE.sRGBEncoding;R3.toneMapping=THREE.ACESFilmicToneMapping;
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(28,W/H,.1,100);cam.position.z=12;
{const c=document.createElement('canvas');c.width=2048;c.height=1024;const x=c.getContext('2d');x.fillStyle='#040606';x.fillRect(0,0,2048,1024);
 [[0,300,2048,70,'#2BF07A'],[0,640,2048,40,'#fff'],[0,800,2048,90,'#3FD8F0'],[520,0,90,1024,'#2BF07A'],[1240,0,110,1024,'#3FD8F0'],[180,0,60,1024,'#fff']].forEach(([a,b,w,h,col])=>{x.fillStyle=col;x.fillRect(a,b,w,h)});
 const t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;t.encoding=THREE.sRGBEncoding;scene.environment=new THREE.PMREMGenerator(R3).fromEquirectangular(t).texture}
const G=new THREE.BufferGeometry();G.setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array(144),3));
function shape(R,r,d){const P=[];for(let i=0;i<8;i++){const a=Math.PI/2-i*Math.PI/4,k=i%2?r:R;P.push([Math.cos(a)*k,Math.sin(a)*k,0])}
 const A=G.attributes.position.array;let n=0;const put=v=>{A[n++]=v[0];A[n++]=v[1];A[n++]=v[2]};
 for(let i=0;i<8;i++){const p=P[i],q=P[(i+1)%8];put([0,0,d]);put(q);put(p);put([0,0,-d]);put(p);put(q)}G.attributes.position.needsUpdate=true;G.computeVertexNormals()}
const hero=new THREE.Mesh(G,new THREE.MeshStandardMaterial({metalness:1,roughness:.04,flatShading:true}));scene.add(hero);
const UPP=2*12*Math.tan(14*Math.PI/180)/H;
// по сценам: x, y (доли кадра), масштаб и форма [длина луча, впадина, толщина]
const POS=W>H?[[.8,.5,.55],[.5,.31,.45]]:[[.5,.3,.42],[.5,.36,.4]],SHP=[[1.9,.5,1.05],[1.6,.85,.8]];
function drawHero(t,s){const sp=t-s*4,pv=POS[Math.max(0,s-1)],cu=POS[s],e=s?stepR(sp,11,.72):1,f=clamp(sp/.7),ps=SHP[Math.max(0,s-1)],cs=SHP[s];
 shape(lerp(ps[0],cs[0],f),lerp(ps[1],cs[1],f),lerp(ps[2],cs[2],f));
 hero.position.set((lerp(pv[0],cu[0],e)-.5)*W*UPP,-(lerp(pv[1],cu[1],e)-.5)*H*UPP,0);hero.scale.setScalar(lerp(pv[2],cu[2],e)*(1+.04*kick(t)));
 hero.rotation.set(.32+.2*Math.sin(t*.8),t*1.1,.15*Math.sin(t*.6));R3.render(scene,cam)}

// ---------- сцены ----------
const S=[mk(F,'L'),mk(F,'L')];
const T1=mk(S[0],'a U','Ваш',`left:${(W>H?150:80)*U}px;top:${H*(W>H?.28:.5)}px;font-size:${(W>H?150:110)*U}px`),T2=mk(S[0],'a U grad','заголовок',`left:${(W>H?150:80)*U}px;top:${H*(W>H?.28:.5)+(W>H?160:120)*U}px;font-size:${(W>H?150:96)*U}px`);
const T3=mk(S[1],'a U','Сцена два',`left:50%;top:${H*.65}px;font-size:${110*U}px;transform:translateX(-50%)`);

function seek(t){const s=Math.min(1,Math.floor(t/4));S.forEach((e,i)=>on(e,i===s));drawHero(t,s);
 if(s===0){pop(T1,t,.1,-30,0);pop(T2,t,.6,0,40)}
 if(s===1){pop(T3,t,4.2,0,40)}}
window.READY=(async()=>{await Promise.all(['900 100px Unbounded','800 30px Manrope'].map(f=>document.fonts.load(f,'АБВ abc')));await document.fonts.ready;seek(0);return true})();
</script></body></html>
